<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>黑胶歌曲信息 · 实现验证</title><style>*{box-sizing:border-box}body{margin:0;background:#111820;color:#dbe6ed;font:13px system-ui,sans-serif}header{height:76px;padding:7px 12px;display:flex;align-items:center;flex-wrap:wrap;gap:7px}button,select{background:#23313d;color:#edf4f8;border:1px solid #617586;border-radius:6px;padding:6px 9px}iframe{display:block;margin:auto;width:100%;height:calc(100vh - 76px);border:0}small{color:#b2c2d1}#check{margin-left:auto}</style><header><b>黑胶歌曲信息 · 实现预览</b><small>默认封面 / 原创示例 / 非车机实测</small><select id="sample"><option value="normal">正常歌曲</option><option value="long">长歌名</option><option value="missing">缺歌手</option><option value="empty">无曲目</option><option value="paused">暂停</option><option value="error">读取失败</option><option value="same">同名不同曲目</option></select><select id="spectrum"><option>bands</option><option>ribbon</option><option>terrain</option><option>led</option></select><button id="narrow">窄屏</button><button id="day">白天</button><button id="night">夜间</button><span id="check"></span></header><iframe title="P7 实际实现页面" src="../app/src/main/assets/index.html"></iframe><script>
const f=document.querySelector('iframe');let isNarrow=false;
document.querySelector('#narrow').onclick=()=>{isNarrow=!isNarrow;f.style.width=isNarrow?'390px':'100%';};
function tone(s){const b=f.contentDocument.querySelector('[data-key="'+s+'"]');if(b)b.click();}
document.querySelector('#day').onclick=()=>tone('daylight');document.querySelector('#night').onclick=()=>tone('night');
setInterval(()=>{const w=f.contentWindow,d=f.contentDocument;if(!d)return;const mode=document.querySelector('#sample').value;w.__lyricData={song:mode==='long'?'沿途的微光与下一站晴朗天空——现场特别版本 Acoustic Live Session':mode==='empty'?'':'沿途的微光',artist:mode==='missing'||mode==='empty'?'':'晚风电台 · 原创示例',mediaId:mode==='same'?'example-b':'example-a',mediaState:mode==='empty'?'empty':mode==='error'?'error':'available',lyric:'[00:00.00]晚风掠过安静的街口\n[00:01.00]让微光陪我们慢慢向前\n[99:00.00]下一站还有晴朗的天空',status:mode==='paused'?1:0,pos:1500,ts:Date.now()};let t=performance.now()/1000;w.__audioFreq=Array.from({length:64},(_,i)=>.6*(.12+.88*Math.pow(Math.abs(Math.sin(i*.2+t*.8)*Math.cos(i*.07-t*.6)),2)));const s=d.querySelector('#spectrumStyle'),wanted=document.querySelector('#spectrum').value;if(s&&s.value!==wanted){s.value=wanted;s.dispatchEvent(new Event('change',{bubbles:true}));}document.querySelector('#check').textContent=d.querySelector('#songMeta')?.getAttribute('data-media-state')||'加载中';},160);
</script></html>
