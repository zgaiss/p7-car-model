<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>四种频谱 · 6.25Hz模拟FFT</title><style>
*{box-sizing:border-box}body{margin:0;background:#111820;color:#dae2e7;font:12px system-ui,sans-serif}header{height:76px;padding:6px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}button{padding:5px 10px;border:1px solid #697780;background:#24313b;color:#fff;border-radius:6px;cursor:pointer}button.active{background:#49616c}iframe{display:block;width:100%;height:calc(100vh - 76px);border:0}small{margin-left:auto;color:#c4cbd0}
</style><header><b>6.25Hz模拟FFT · 非车机实测</b><button data-style="bands">彩色波带</button><button data-style="ribbon">渐变丝带</button><button data-style="terrain">多层山脊</button><button data-style="led">彩色柱状</button><button id="cycle">同输入四种对比</button><small id="state">静默</small><div style="width:100%;display:flex;gap:6px"><button data-mode="silent">静默</button><button data-mode="normal">普通</button><button data-mode="beat">强拍</button><button data-mode="paused">暂停</button><button data-mode="lost">断流</button><button id="power">总开关</button><span style="padding:5px">丝带呈现频带历史艺术映射，不是原始波形</span></div></header><iframe src="../app/src/main/assets/index.html" title="P7实际页面"></iframe><script>
const f=document.querySelector('iframe');let mode='silent',cycle=false,start=performance.now(),lastStyle='';
function setStyle(s){const select=f.contentDocument&&f.contentDocument.querySelector('#spectrumStyle');if(!select)return;if(select.value!==s){select.value=s;select.dispatchEvent(new Event('change',{bubbles:true}));}lastStyle=s;document.querySelectorAll('[data-style]').forEach(b=>b.classList.toggle('active',b.dataset.style===s));}
function setMode(m){mode=m;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));document.querySelector('#state').textContent={silent:'静默 · 静止基线',normal:'普通 · 真实更新率模拟',beat:'强拍 · 真实更新率模拟',paused:'暂停 · 平滑归零',lost:'断流 · 超时归零'}[m];}
document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{cycle=false;setStyle(b.dataset.style)});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{cycle=false;setMode(b.dataset.mode)});document.querySelector('#power').onclick=()=>f.contentDocument.querySelector('#drawerSpectrumBtn').click();document.querySelector('#cycle').onclick=()=>{cycle=true;start=performance.now()};
f.onload=()=>{const select=f.contentDocument.querySelector('#spectrumStyle');if(select)setStyle(select.value);};
setInterval(()=>{let t=performance.now()/1000;if(cycle){let elapsed=(performance.now()-start)/1000;setStyle(['bands','ribbon','terrain','led'][Math.floor(elapsed/7.68)%4]);let phase=elapsed%7.68;setMode(phase<.5?'silent':phase>6.7?'paused':'beat');}if(cycle)t=((Math.floor((performance.now()-start)/160)%48)*160)/1000;if(mode==='lost')return;const w=f.contentWindow;w.__lyricData={song:'沿途的微光',artist:'P7 原创示例 · 音频动效预览',lyric:'[00:00.00]晚风掠过安静的街口\n[00:01.00]让微光陪我们慢慢向前\n[99:00.00]下一站还有晴朗的天空',status:mode==='paused'?1:0,pos:1500,ts:Date.now()};const pulse=Math.pow(Math.max(0,Math.sin(t*Math.PI*3)),2);w.__audioFreq=Array.from({length:64},(_,i)=>{if(mode==='silent')return 0;const texture=.12+.88*Math.pow(Math.abs(Math.sin(i*.20+t*.8)*Math.cos(i*.07-t*.6)),2);return Math.min(1,texture*(mode==='beat'?.40+.60*pulse:.25+.35*pulse));});},160);setMode('silent');
</script></html>
