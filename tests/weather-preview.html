<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Nebula 天气预览</title><style>body{margin:0;background:#101820;color:#e7edf3;font:14px sans-serif}header{padding:18px 24px}h1{font-size:22px;margin:0 0 6px}p{color:#aabac8;margin:0}button{margin:10px 8px 0 0;background:#263c4c;color:#eaf5ff;border:1px solid #567082;border-radius:12px;padding:8px 18px;cursor:pointer}iframe{width:100%;height:620px;border:0;display:block}#diag{font:11px monospace;max-width:100%;overflow-wrap:anywhere;color:#a0adb8;position:fixed;bottom:0;background:#14202b;padding:3px}</style><header><h1>天气模拟 · 增强可见度预览</h1><p>复用 three-nebula 13.3.0 · 红色车漆 · 增强粒子大小与对比度 · 离线模拟，未使用 GPS / 天气网络</p><button onclick="show('none')">无降水基线</button><button onclick="show('rain')">细雨</button><button onclick="show('snow')">轻雪</button><button onclick="show('stars')">晴夜星空</button></header><iframe id="view"></iframe><div id="diag"></div><script>function show(k){document.getElementById('view').src='../app/src/main/assets/index.html?qa=1&weatherPreview='+k;}show(new URLSearchParams(location.search).get('kind')||'snow');setInterval(function(){var w=view.contentWindow.__weatherPreview;if(w)diag.textContent='Nebula 13.3.0 · '+w.state().visible.join(', ')+' · 模拟粒子 '+w.state().particleCounts.join(' / ');},1000);</script></html>
