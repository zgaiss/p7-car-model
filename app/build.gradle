plugins {
    id 'com.android.application'
}

// Credentials stay in ignored root local.properties; public builds disable the service by default.
def lightProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { lightProperties.load(it) }
}

// Optional fixed test keystore (ignored by git). Android ID -- and therefore the light SDK
// authorization -- is scoped to the app signing key, so a stable debug signature keeps the
// device activated across rebuilds instead of forcing a new WeChat QR scan every install.
def testKeystoreFile = rootProject.file('dev/p7show-test.jks')
def hasTestKeystore = testKeystoreFile.exists()

android {
    buildFeatures {
        buildConfig true
    }
    namespace 'com.xpeng.p7show'
    compileSdk 36

    signingConfigs {
        if (hasTestKeystore) {
            p7test {
                storeFile testKeystoreFile
                storePassword 'p7showtest'
                keyAlias 'p7test'
                keyPassword 'p7showtest'
            }
        }
    }

    defaultConfig {
        applicationId "com.xpeng.p7show"
        buildConfigField 'String', 'P7_LIGHT_SDK_KEY', groovy.json.JsonOutput.toJson(lightProperties.getProperty('p7.light.sdkKey', ''))
        buildConfigField 'String', 'P7_LIGHT_ACCESS_KEY', groovy.json.JsonOutput.toJson(lightProperties.getProperty('p7.light.accessKey', ''))
        minSdk 24
        targetSdk 36
        // v1.18.6：红绿灯 HUD（多相位/建议/悬浮窗）
        versionCode 24
        versionName "1.18.6"
    }

    buildTypes {
        debug {
            if (hasTestKeystore) {
                signingConfig signingConfigs.p7test
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 本地有测试 keystore 时用它签 release（密钥不入库）；CI 上无 keystore 则为未签名
            if (hasTestKeystore) {
                signingConfig signingConfigs.p7test
            }
        }
    }

    // Keep source models for offline preparation/tests, but ship only the active rig.
    androidResources {
        ignoreAssetsPatterns.addAll(['XPP7_Model_v1.glb', 'XPP7_Model_v4.glb'])
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 全部资源本地化，无外部依赖；WebView 由系统提供
}
