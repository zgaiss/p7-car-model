<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>P7 SHOW</title>
<link rel="stylesheet" href="car-paint.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1420; font-family: "Microsoft YaHei", system-ui, sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: #191919; } /* B项：画布透明后兜底深色底，保证歌词从车模轮廓外可读 */
  #container { position: fixed; inset: 0; }
  #container canvas { display: block; }
  /* 左上角 24 小时制数字时钟（点击弹出设置浮窗）：白色无衬线、无背景/边框/阴影 */
  #clock {
    position: fixed;
    top: 2.2vw;
    left: 2.4vw;
    z-index: 5;
    color: #ffffff;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: none;
    border: none;
    box-shadow: none;
    text-shadow: none;
    line-height: 1.12;
    cursor: pointer;
    pointer-events: auto; /* 仅时钟区域可点，不拦截其余 3D 操作 */
    -webkit-user-select: none;
    user-select: none;
  }
  #clockTime { font-size: 7vw; font-weight: 600; letter-spacing: 0.05em; }
  #clockDate { font-size: 2.6vw; opacity: 0.92; margin-top: 0.2vw; }
  /* 红绿灯倒计时卡片（左上角、时钟下方）：黑色半透明底、圆角、小号字体，只读展示不拦截 3D 交互 */
  #lightCard {
    position: fixed;
    top: 14.6vw; /* 比原 12.2vw 再下移约 2.4vw（本轮 UI 微调） */
    left: 2.4vw;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 0.7vw;
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 1.4vw;
    padding: 0.7vw 1.2vw;
    font-size: 1.35vw;
    letter-spacing: 0.08vw;
    color: rgba(255,255,255,0.92);
    line-height: 1.2;
    pointer-events: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #lightDot {
    width: 1.5vw;
    height: 1.5vw;
    border-radius: 50%;
    background: transparent;
    box-shadow: 0 0 0.6vw rgba(255,255,255,0.35);
    flex: none;
  }
  #lightDot.off { background: rgba(255,255,255,0.25); box-shadow: none; }
  #lightDot.red { background: #ff4d4f; box-shadow: 0 0 0.8vw rgba(255,77,79,0.7); }
  #lightDot.green { background: #52c41a; box-shadow: 0 0 0.8vw rgba(82,196,26,0.7); }
  #lightDot.yellow { background: #f5c518; box-shadow: 0 0 0.8vw rgba(245,197,24,0.7); }
  /* Song metadata stays above the spectrum; readable at a glance. */
  #songMeta {
    position: fixed;
    right: max(24px, 2.4vw);
    bottom: calc(20vh + 8px);
    z-index: 30;
    width: max-content;
    max-width: min(42vw, 640px);
    padding: 2px 0 2px 18px;
    border-left: 2px solid rgba(193,208,216,.65);
    text-align: left;
    pointer-events: none;
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif;
    text-shadow: 0 2px 5px rgba(0,0,0,.8);
  }
  #songTitle {
    font-size: clamp(22px, 3.5vh, 42px);
    font-weight: 600;
    line-height: 1.32;
    letter-spacing: .01em;
    color: #f3f1e9;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
    overflow-wrap: break-word;
  }
  #songArtist {
    margin-top: 5px;
    font-size: clamp(14px, 2.1vh, 24px);
    font-weight: 400;
    line-height: 1.45;
    letter-spacing: .02em;
    color: #bac6d0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #songArtist:empty { display: none; }
  @media (max-width: 520px) {
    #songMeta { right: 20px; width: calc(100vw - 40px); max-width: none; padding-left: 12px; top: max(96px, 14vh); bottom: auto !important; text-align: left; }
    #songTitle { font-size: clamp(20px, 3.2vh, 28px); }
    #songArtist { font-size: 14px; margin-top: 6px; }
  }
  #openingControls { position: fixed; right: 16px; top: max(16px, env(safe-area-inset-top)); z-index: 15; display: grid; grid-template-columns: repeat(2, minmax(76px, 1fr)); gap: 6px; padding: 8px; background: rgba(14,22,30,.72); border: 1px solid #ffffff24; border-radius: 14px; backdrop-filter: blur(12px); }
  #openingControls button { min-height: 42px; padding: 8px 10px; border-radius: 8px; border: 1px solid #ffffff30; background: #ffffff0a; color: #fff; font: 13px system-ui, sans-serif; cursor: pointer; }
  #openingControls button[aria-pressed="true"] { background: #82bbd530; border-color: #9cd7e9; }
  #openingControls button:disabled { opacity: .4; cursor: wait; }
  #openingControls button:focus-visible { outline: 2px solid #9cd7e9; outline-offset: 2px; }
  @media (max-width: 520px) { #openingControls { top: auto; bottom: max(64px, env(safe-area-inset-bottom)); right: 10px; grid-template-columns: repeat(3, minmax(70px, 1fr)); } }
  #status { position: fixed; left: 2vw; bottom: 2vw; color: rgba(255,255,255,0.55); font-size: 11px; letter-spacing: 1px; text-shadow: 0 1px 3px rgba(0,0,0,0.7); z-index: 10; pointer-events: none; opacity: 0.6; } /* 加载说明文字：屏幕最左下方（本轮 UI 微调） */
  #freqCanvas { position: fixed; left: 0; bottom: 0; width: 100%; height: 48px; z-index: 20; pointer-events: none; display: block; }
  #lightBtn {
    display: none; /* 主界面悬浮按钮：不再显示（保留 DOM 与点击逻辑供浮窗复用） */
    position: fixed; left: 1.8vw; top: calc(50% - 9.3vw); z-index: 30;
    background: rgba(20,32,48,0.55);
    color: rgba(255,255,255,0.92);
    border: 1px solid rgba(255,255,255,0.28);
    border-radius: 2.2vw;
    padding: 0.9vw 1.8vw;
    font-size: 1.45vw;
    letter-spacing: 0.12vw;
    cursor: pointer;
    backdrop-filter: blur(4px);
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, opacity 0.35s ease;
  }
  #lightBtn.on {
    background: rgba(255,210,120,0.26);
    border-color: rgba(255,210,120,0.75);
    color: #ffd98a;
  }
  #lightBtn.disabled { opacity: 0.4; cursor: default; }
  #sceneBtns {
    display: none; /* 主界面悬浮按钮组：不再显示（保留 DOM 与点击逻辑供浮窗复用） */
    flex-direction: column;
    gap: 0.9vw;
    position: fixed; left: 1.8vw; top: calc(50% - 4.5vw);
    z-index: 30;
    opacity: 1;
    transition: opacity 0.35s ease;
  }
  /* 场景/灯光按钮全局样式（主界面隐藏按钮与左侧浮窗共用） */
  .skyBtn {
    background: rgba(20,32,48,0.55);
    color: rgba(255,255,255,0.92);
    border: 1px solid rgba(255,255,255,0.28);
    border-radius: 2.2vw;
    padding: 0.9vw 1.8vw;
    font-size: 1.45vw;
    letter-spacing: 0.12vw;
    cursor: pointer;
    backdrop-filter: blur(4px);
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .skyBtn.active, .skyBtn.on {
    background: rgba(255,210,120,0.26);
    border-color: rgba(255,210,120,0.75);
    color: #ffd98a;
  }
  /* ---------- 左侧滑出式设置浮窗（drawer） ---------- */
  #drawer {
    position: fixed; left: 0; top: 0; bottom: 0;
    width: 33vw;
    background: rgba(20,32,48,0.85);
    border-radius: 0 2.2vw 2.2vw 0; /* 圆角右缘 */
    z-index: 40; /* 高于 3D 画布与悬浮按钮 */
    transform: translateX(-100%);
    padding: 4vw 2.2vw;
    display: flex;
    flex-direction: column;
    gap: 1.4vw;
    pointer-events: none; /* 完全收起时不拦截左侧 3D 操作，由 JS 跟手时恢复 auto */
    will-change: transform;
  }
  #drawerTitle {
    font-size: 2.2vw;
    letter-spacing: 0.2vw;
    color: rgba(255,255,255,0.95);
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);
    margin-bottom: 0.6vw;
  }
  /* 抽屉内部滚动容器：标题/关闭按钮固定不动，其余内容超长时向下滚动查看 */
  #drawerScroll {
    flex: 1 1 auto;
    min-height: 0; /* flex 子项允许收缩，溢出触发滚动 */
    overflow-y: auto;
    scrollbar-width: none;      /* Firefox 隐藏滚动条 */
    -ms-overflow-style: none;   /* IE/Edge 隐藏滚动条 */
    display: flex;
    flex-direction: column;
    gap: 1.4vw;
  }
  #drawerScroll::-webkit-scrollbar { display: none; }
  #drawer .skyBtn { width: 100%; text-align: center; }
  /* 微信扫码绑定激活二维码展示区（设置浮窗内，红绿灯按钮下方） */
  #lightQrBox {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1vw;
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 1.6vw;
    padding: 1.4vw;
  }
  #lightQrImg {
    width: 20vw;
    height: 20vw;
    border-radius: 0.8vw;
    background: #ffffff;
    object-fit: contain;
  }
  #lightQrStatus {
    font-size: 1.15vw;
    letter-spacing: 0.08vw;
    color: rgba(255,255,255,0.92);
    text-align: center;
    line-height: 1.4;
  }
  #drawerCloseBtn {
    position: absolute; top: 2.4vw; right: 2.4vw;
    width: 4.4vw; height: 4.4vw;
    background: rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.92);
    border: 1px solid rgba(255,255,255,0.28);
    border-radius: 50%;
    font-size: 2.2vw;
    line-height: 1;
    cursor: pointer;
    z-index: 1;
  }
  /* 右侧歌词面板：横屏显示，右缘上偏，宽约 1/3 屏宽、高约 40% 屏高；
     无背景框（透明），纯文字白色带黑边阴影 */
  #lyricPanel {
    display: none;
    position: fixed;
    right: 1vw;
    top: 1vw;
    width: calc(13.333vw - 1.6vw);
    height: 16vh;
    z-index: 30; /* v5：屏幕固定层，右上角，不随 3D 镜头旋转 */
    padding: 0.5vw 0.7vw;
    color: #ffffff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.9), 0 0 3px rgba(0,0,0,0.8), 1px 1px 2px rgba(0,0,0,0.9), -1px -1px 2px rgba(0,0,0,0.9);
    pointer-events: none;
    overflow: hidden;
  }
  #lyricMeta {
    font-size: 0.72vw;
    letter-spacing: 0.05vw;
    opacity: 1;
    margin-bottom: 0.35vw;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #lyricBody {
    height: calc(100% - 1.2vw);
    overflow-y: scroll;
    scrollbar-width: none;
    position: relative;
    /* B项：上下边缘渐变淡出（首尾句 fade out） */
    -webkit-mask-image: linear-gradient(to bottom, transparent, black 18%, black 82%, transparent);
    mask-image: linear-gradient(to bottom, transparent, black 18%, black 82%, transparent);
  }
  #lyricBody::-webkit-scrollbar { display: none; }
  .lyric-line {
    font-size: 0.92vw;
    line-height: 1.7;
    color: rgba(160,160,160,0.45); /* B项：已播/未播歌词半透灰 */
    text-shadow: none; /* 覆盖面板继承阴影，非活跃行无阴影 */
    padding: 1px 0;
    white-space: normal;         /* 单句过长自动换行 */
    word-break: break-word;      /* 中英文/长单词均可断行 */
    overflow-wrap: break-word;
    transition: color 0.25s ease, opacity 0.25s ease, transform 0.25s ease;
  }
  .lyric-line.active {
    color: #ffffff; /* B项：当前句白色 + 黑边阴影 */
    font-weight: 600;
    text-shadow: 0 1px 2px rgba(0,0,0,0.9), 0 0 3px rgba(0,0,0,0.8), 1px 1px 2px rgba(0,0,0,0.9), -1px -1px 2px rgba(0,0,0,0.9);
  }
  #lyricPlaceholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.92vw;
    color: #ffffff;
  }
  /* Narrow screens cannot contain the world-space lyric plane. Use the same
     timed text in a compact, non-interactive reading area above the car. */
  @media (max-width: 520px) {
    #lyricPanel { left: 20px; right: 20px; top: max(196px, calc(14vh + 100px)) !important; width: auto; height: 78px; padding: 0; text-shadow: 0 2px 5px rgba(0,0,0,.8); font-family: system-ui, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
    #lyricMeta { display: none; }
    #lyricBody { height: 100%; overflow: hidden; mask-image: none; -webkit-mask-image: none; }
    .lyric-line { display: none !important; font-size: 22px; line-height: 1.45; color: #bac6d0; font-weight: 400; }
    .lyric-line.focus { display: -webkit-box !important; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
    .lyric-line.active { color: #f3f1e9; font-weight: 600; text-shadow: inherit; }
    #lyricPlaceholder { justify-content: flex-start; align-items: flex-start; font-size: 18px; color: #aab4be; }
  }
  body[data-music-tone="day"] #songMeta { border-color: #42586799; text-shadow: 0 1px 2px #ffffff55; }
  body[data-music-tone="day"] #songTitle,
  body[data-music-tone="day"] .lyric-line.active { color: #223541; }
  body[data-music-tone="day"] #songArtist,
  body[data-music-tone="day"] .lyric-line,
  body[data-music-tone="day"] #lyricPlaceholder { color: #425867; }
  body[data-music-tone="day"] #lyricPanel { text-shadow: 0 1px 2px #ffffff55; }
  @media (max-width: 600px) {
    #drawer { width: min(90vw, 360px); padding-left: 18px; padding-right: 18px; gap: 12px; }
    #drawerTitle { font-size: 20px; min-height: 44px; display: flex; align-items: center; }
    #drawerCloseBtn { width: 44px; height: 44px; right: 12px; font-size: 24px; }
    #drawerScroll { gap: 10px; }
    #drawer .skyBtn { min-height: 44px; font-size: 14px; }
  }
</style>
</head>
<body>
  <div id="container"></div>
  <div id="status">正在加载模型…</div>

  <!-- 左上角 24 小时制时钟（点击弹出左侧设置浮窗，替代原左滑手势） -->
  <div id="clock">
    <div id="clockTime">00:00</div>
    <div id="clockDate"></div>
  </div>

  <!-- 红绿灯倒计时卡片（路径A：SDK 原生层推送 window.__lightData 驱动；未就绪显示占位） -->
  <div id="lightCard">
    <span id="lightDot" class="off"></span>
    <span id="lightText">红绿灯服务未就绪</span>
  </div>

  <!-- 右下方歌曲信息（歌名 + 歌手，两行靠右，位于底部频谱条上方；初始隐藏，有歌词数据时显示） -->
  <div id="songMeta" style="display:none;">
    <div id="songTitle"></div>
    <div id="songArtist"></div>
  </div>

  <!-- 左侧滑出式设置浮窗（场景切换 + 灯光开关 + 频谱开关） -->
  <div id="drawer">
    <button id="drawerCloseBtn" title="收起">×</button>
    <div id="drawerTitle">设置</div>
    <div id="drawerScroll">
      <div id="drawerSceneWrap"></div>
      <div id="drawerPaintSettings"></div>
      <button id="drawerTimeSyncBtn" class="skyBtn">随时间同步：开</button>
      <button id="drawerDefaultViewBtn" class="skyBtn">默认视角：开</button>
      <button id="drawerCustomViewBtn" class="skyBtn">使用自定义视角</button>
      <button id="drawerSaveViewBtn" class="skyBtn">保存当前视角</button>
      <div id="cameraViewStatus" role="status" style="font-size:13px;line-height:1.5;padding:8px 0;color:#ddd;">拖动到喜欢的角度，再保存</div>
      <button id="drawerSpectrumBtn" class="skyBtn" aria-pressed="true">频谱：开</button>
      <label for="spectrumStyle" style="display:block;margin:12px 0 6px;color:#c7d5df;font-size:13px">频谱样式</label>
      <select id="spectrumStyle" aria-label="频谱样式" style="width:100%;padding:12px;border-radius:10px;border:1px solid #526473;background:#19232d;color:#eff5fa;font-size:15px">
        <option value="bands">彩色波带</option><option value="ribbon">渐变丝带</option><option value="terrain">多层山脊</option><option value="led">彩色柱状</option>
      </select>
      <button id="drawerLightTrafficBtn" class="skyBtn">红绿灯倒计时：未激活</button>
      <!-- 微信扫码绑定激活二维码展示区（默认隐藏；点击红绿灯按钮后显示） -->
      <div id="lightQrBox" style="display:none;">
        <img id="lightQrImg" alt="微信绑定二维码" />
        <div id="lightQrStatus">待扫码</div>
      </div>
    </div>
  </div>

  <div id="openingControls" role="group" aria-label="车门及舱盖控制"></div>
  <div id="lightBtn">灯光关</div>
  <div id="sceneBtns" class="sceneBtns"></div>
  <div id="lyricPanel">
    <div id="lyricMeta"></div>
    <div id="lyricBody"></div>
    <div id="lyricPlaceholder">暂无歌词</div>
  </div>

  <script src="three.min.js"></script>
  <script src="GLTFLoader.js"></script>
  <script src="OrbitControls.js"></script>
  <script src="RGBELoader.js"></script>
  <script src="body-openings.js"></script>
  <script src="car-paint.js"></script>
  <script src="car-reflection.js"></script>
  <script src="camera-home.js"></script>
  <script src="lyrics-display.js"></script>
  <script src="vendor/siriwave/siriwave.umd.js"></script>
  <script src="vendor/soundvisualizer/glow.js"></script>
  <script src="vendor/soundvisualizer/terrain.js"></script>
  <script src="vendor/soundvisualizer/ribbon.js"></script>
  <script src="vendor/wave/cubes-2.0.5.js"></script>
  <script src="audio-spectrum-state.js"></script>
  <script src="audio-spectrum.js"></script>
  <script>
    (function () {
      'use strict';

      var container = document.getElementById('container');
      var statusEl = document.getElementById('status');
      var debugEl = document.getElementById('debug');

      // ---------- 渲染器 / 场景 / 相机（按 gltf-viewer.donmccurdy.com 源码 Viewer.js 复刻） ----------
      var scene = new THREE.Scene();
      // B项：移除 scene.background（画布透明，歌词背景层从车模后透出）；环境光由 scene.environment 提供

      var camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 1000); // viewer: new PerspectiveCamera(50, aspect, 0.01, 1000)

      var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); // B项：alpha 透明画布，歌词位于车模后
      renderer.setClearColor(0x000000, 0); // B项：完全透明，露出 body 深色背景
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.useLegacyLights = false; // 物理光照模式，对应新版 three 默认；Neutral 环境 PointLight 强度 900 依赖此模式
      renderer.toneMapping = THREE.ACESFilmicToneMapping; // 场景美化：ACES 柔和高光，防天空/车身高光过曝
      renderer.toneMappingExposure = 0.95; // ACES 下略压高光，亮度由场景参数补偿（防过曝）
      if (typeof renderer.outputEncoding !== 'undefined') { renderer.outputEncoding = THREE.sRGBEncoding; } // r148 须显式 sRGB 输出（新版本默认）
      container.appendChild(renderer.domElement);

      // ---------- 控制器（旋转 + 缩放），限制仰角避免翻到车底 ----------
      var controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.enablePan = false;
      controls.enableZoom = true;
      controls.rotateSpeed = 0.8;
      controls.zoomSpeed = 1.0;
      controls.minPolarAngle = 0.12;
      controls.maxPolarAngle = Math.PI * 0.51; // 略低于齐平，但不翻到底盘以下

      // ---------- 补光（viewer 源码 Viewer.js addLights()：AmbientLight + DirectionalLight 挂在相机上，跟随视角） ----------
      var ambientLight = null;
      var mainLight = null;
      function buildLights() {

        if (lyricSprite3D) lyricSprite3D.visible = !narrow;
      }
      /** 每帧轮询原生推送对象（覆盖式赋值监听不到属性变化，轮询最可靠） */
      var lastLyricPoll = 0;
      function pollLyricData() {
        if (Date.now() - lastLyricPoll < 150) return;
        lastLyricPoll = Date.now();
        try {
          var d = window.__lyricData;
          if (!d) return;
          // 播放状态变化优先处理（暂停/恢复立即对齐本地歌词时钟）
          if (typeof d.status === 'number' && d.status >= 0) {
            applyPlayStatus(d.status);
          }
          var fingerprint = (d.song || '') + '\u0001' + (d.artist || '') + '\u0001' + (d.lyric || '');
          if (fingerprint !== lastLyricApplied) {
            applyLyricData(d);                       // 内容变化：完整解析渲染
          } else if (typeof d.pos === 'number' && d.pos >= 0) {
            applyLyricPos(d.pos);                    // 内容未变：仅校准播放位置
          }
        } catch (e) { /* 解析失败不阻塞渲染 */ }
      }

      // ---------- 窗口适配 ----------
      function onResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        sizeFreqCanvas();
        updateLyricPanelVisibility();
        DRAWER_W_PX = drawerEl ? drawerEl.offsetWidth : window.innerWidth * 0.33; // Include the wider mobile settings panel
        applyDrawerTransform(); // 按新宽度重算浮窗位置（保持当前展开比例）
        if (model) computeHomePose(); // 屏幕尺寸变化时按新视口重算归位目标
      }
      window.addEventListener('resize', onResize);
      window.addEventListener('orientationchange', function () { setTimeout(onResize, 250); });

      // ---------- 渲染循环 ----------
      function animate() {
        requestAnimationFrame(animate);
        var frameNow = performance.now();
        var cameraDt = Math.max(0, (frameNow - cameraFrameTime) / 1000);
        cameraFrameTime = frameNow;
        openings.update(performance.now());
        drawFreq();
        pollLyricData();      // 轮询原生推送的歌词数据（内容变化才处理）
        pollLightData();      // 轮询原生推送的红绿灯数据（500ms 节流）
        updateLyricHighlight(); // 按本地时钟推进高亮当前行
        updateLyricPanelVisibility(); // 横竖屏切换兜底（旋转未触发 resize 时）
        // 实时按当前宽高比选择归位方案：比例状态（竖屏/横屏）变化时立即重算归位目标
        // （窗口尺寸变化本身走 onResize；此处在未触发 resize 的旋转/切屏场景下兜底）
        var portraitNow = window.innerHeight > window.innerWidth;
        if (portraitNow !== lastPortrait) {
          lastPortrait = portraitNow;
          if (model) computeHomePose();
        }
        // 归位（生效目标：自定义视角开启且已记录时用记录值，否则用代码默认归位视角）
        var hP = (useCustomHome && customHomeSet) ? customHomePos : homePos;
        var hT = (useCustomHome && customHomeSet) ? customHomeTarget : homeTarget;
        if (isTweening) {
          var returnAlpha = P7CameraHome.alpha(cameraDt);
          camera.position.lerp(hP, returnAlpha);
          controls.target.lerp(hT, returnAlpha);
          camera.lookAt(controls.target);
          if (camera.position.distanceTo(hP) < 0.02 && controls.target.distanceTo(hT) < 0.02) {
            camera.position.copy(hP);
            controls.target.copy(hT);
            camera.lookAt(controls.target);
            controls.update();
            isTweening = false;
            controls.enabled = true;
            resetTimer();
          }
        } else {
          controls.update();
        }
        // 浮窗展开/收起动画推进（JS 驱动，逐帧联动 3D）
        if (drawerAnim) {
          var dk = (performance.now() - drawerAnim.t0) / drawerAnim.dur;
          if (dk >= 1) dk = 1;
          var de = 1 - Math.pow(1 - dk, 3); // easeOutCubic
          drawerRatio = drawerAnim.from + (drawerAnim.to - drawerAnim.from) * de;
          if (dk >= 1) { drawerRatio = drawerAnim.to; drawerAnim = null; }
          applyDrawerTransform();
        }
        // 浮窗联动已移除（v3）：不移动相机与车模，OrbitControls 保持自由
        if (groundReflection) groundReflection.render(renderer, camera);
        renderer.render(scene, camera);
      }

      buildLights();
      createWater(); // 水面平面 y≈0（半透明蓝灰，高金属低粗糙）
      loadEXRScene(currentSkyKey); // 预加载当前场景天空球（启动时若随时间同步已切到目标场景，则按该场景加载并缓存）
      initAudioSpectrum();
      initLyricPanel();
      initLightCard();
      // ---------- 顶部安全区：全屏沉浸后系统悬浮图标（头像/电量/wifi）与顶部内容重叠，
      // ---------- 通过 AndroidAudioBridge.getStatusBarHeight() 获取状态栏高度换算 vw 偏移，
      // ---------- 将 #clock / #lightCard / #lyricPanel 的 top 在原有 vw 基础上整体下移 ----------
      function applyStatusBarSafeArea() {
        var sbPx = 32; // 兜底：桥调用失败或返回 0 时取 32px
        try {
          if (window.AndroidAudioBridge && typeof window.AndroidAudioBridge.getStatusBarHeight === 'function') {
            var sb = parseInt(window.AndroidAudioBridge.getStatusBarHeight(), 10);
            if (sb && sb > 0) sbPx = sb;
          }
        } catch (e) { /* 异常保持兜底 */ }
        var safeVw = sbPx / (window.screen.width / 100); // 用屏幕宽度换算 vw（v1.14 初版）
        if (!isFinite(safeVw) || safeVw <= 0) return;
        var targets = {
          clock: 2.2,      // 时钟（v1.14 初版）
          lightCard: 14.6, // 红绿灯卡片（v1.14 初版）
          lyricPanel: 1    // 歌词面板（v1.14 初版）
        };
        for (var id in targets) {
          var el = document.getElementById(id);
          if (el) el.style.top = (targets[id] + safeVw) + 'vw';
        }
        // 设置抽屉 #drawer：整体下移安全区，避免标题/场景按钮/灯光按钮与顶部系统悬浮图标重叠
        var drawer = document.getElementById('drawer');
        if (drawer) drawer.style.paddingTop = (4 + safeVw) + 'vw';
        var drawerClose = document.getElementById('drawerCloseBtn');
        if (drawerClose) drawerClose.style.top = (2.4 + safeVw) + 'vw';
      }
      applyStatusBarSafeArea();
      window.addEventListener('resize', applyStatusBarSafeArea);
      animate();
    })();
  </script>
</body>
</html>
